name: "💬 Community Support"
description: "Ask a question or get help from the community"
title: "[Support]: "
labels: ["question", "support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! Before submitting, please check:
        - [Docs](https://github.com/your-org/onux/docs)
        - [Existing discussions](https://github.com/your-org/onux/discussions)
        - [FAQ](docs/faq.md)

        For faster help, join our [Discord](https://discord.gg/YOUR_INVITE_CODE) or [Telegram](https://t.me/YOUR_GROUP_LINK).

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area does your question relate to?
      options:
        - Getting started / Setup
        - Integration / SDK usage
        - Configuration
        - Deployment
        - Chain / Network specific (TON, TRON, etc.)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Your question
      description: Describe what you're trying to do and what's unclear.
      placeholder: I'm trying to… but I'm not sure how to…
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include relevant details — OS, browser, SDK version, code snippets, error messages.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: Did you search for existing answers?
      options:
        - label: I checked the docs and existing issues/discussions
          required: true
