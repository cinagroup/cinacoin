name: Deploy Website to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  deploy:
    name: Build & Deploy Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Website
        run: |
          # Clean ALL caches before build
          rm -rf apps/website/.next/cache
          rm -rf apps/website/cache
          rm -rf cache/
          pnpm --filter cinacoin-website build

      - name: Clean cache files before deploy
        run: |
          # Remove ALL cache directories that wrangler might scan
          rm -rf apps/website/.next/cache
          rm -rf apps/website/cache
          rm -rf apps/website/out/cache
          # CRITICAL: Also clean root-level cache (wrangler scans entire repo)
          rm -rf cache/
          rm -rf .next/
          # Verify no large files remain
          find . -path "*/node_modules" -prune -o -type f -size +20M -print 2>/dev/null
          echo "Cache cleaned"

      - name: Verify Output
        run: |
          if [ -d "apps/website/out" ]; then
            echo "✓ Static output directory exists"
            echo "Files generated:"
            find apps/website/out -type f | wc -l
          else
            echo "✗ Static output directory not found"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy apps/website/out --project-name=cinacoin-website --branch=main
        env:
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
