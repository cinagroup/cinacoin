name: Deploy Consolidation Router to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "workers/router/**"
      - ".github/workflows/deploy-router.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Router Worker
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-router-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy Router Worker
        working-directory: workers/router
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
