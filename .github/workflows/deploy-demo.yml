name: Deploy Demo to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/demo/**"
      - "packages/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ── Build & Deploy ────────────────────────────────────────────
  deploy:
    name: Build & Deploy Demo
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: deploy-demo-${{ github.event.inputs.environment || 'production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        run: |
          # Clean ALL caches before build (root + app level)
          rm -rf apps/demo/.next/cache
          rm -rf apps/demo/cache
          rm -rf cache/webpack
          rm -rf cache/
          pnpm --filter demo build
        env:
          NODE_ENV: production

      - name: Verify static output
        run: |
          if [ -d "apps/demo/out" ]; then
            echo "✓ Static output directory exists"
            echo "Files generated:"
            find apps/demo/out -type f | wc -l
          else
            echo "✗ Static output directory not found"
            exit 1
          fi

      - name: Clean cache files before deploy
        run: |
          # CRITICAL: Next.js build generates cache/ in monorepo root
          # Must clean AFTER build, BEFORE deploy (wrangler scans entire repo)
          rm -rf cache/
          rm -rf apps/demo/.next/cache
          rm -rf apps/demo/out/cache
          # Verify no large files remain
          echo "=== Checking for large files ==="
          find . -path "*/node_modules" -prune -o -type f -size +20M -print 2>/dev/null || echo "None found"
          echo "Cache cleaned"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy apps/demo/out --project-name=cinacoin-demo --branch=main
        env:
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
