name: Deploy Demo to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/demo/**"
      - "packages/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ── Build & Deploy ────────────────────────────────────────────
  deploy:
    name: Build & Deploy Demo
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: deploy-demo-${{ github.event.inputs.environment || 'production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        run: pnpm --filter demo build
        env:
          NODE_ENV: production

      - name: Verify static output
        run: |
          if [ -d "apps/demo/out" ]; then
            echo "✓ Static output directory exists"
            echo "Files generated:"
            find apps/demo/out -type f | wc -l
          else
            echo "✗ Static output directory not found"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/demo/out --project-name=cinacoin-demo
        env:
          NODE_ENV: production
