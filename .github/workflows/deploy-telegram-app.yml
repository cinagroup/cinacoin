name: Deploy Telegram App

on:
  push:
    branches: [main]
    paths:
      - 'apps/telegram-app/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          cd packages/telegram-miniapp
          npm run build

      - name: Build app
        run: |
          cd apps/telegram-app
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cinacoin-telegram-app
          directory: apps/telegram-app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
