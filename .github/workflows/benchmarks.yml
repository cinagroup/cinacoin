name: Performance Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      save_baseline:
        description: 'Save this run as the new baseline'
        type: boolean
        default: false

jobs:
  benchmarks:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Run benchmarks
        id: bench
        continue-on-error: true
        working-directory: packages/perf-benchmarks
        run: npx tsx src/run.ts --ci --baseline-file results/baseline.json --regression-threshold 20 --output-dir results

      - name: Check if regression detected
        id: check
        run: |
          if [ "${{ steps.bench.outcome }}" = "failure" ]; then
            echo "REGRESSION=true" >> "$GITHUB_OUTPUT"
          else
            echo "REGRESSION=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save baseline (on manual trigger)
        if: github.event_name == 'workflow_dispatch' && inputs.save_baseline
        working-directory: packages/perf-benchmarks
        run: npx tsx src/run.ts --save-baseline results/baseline.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            packages/perf-benchmarks/results/latest.json
            packages/perf-benchmarks/results/report.md

      - name: Fail if regression detected
        if: steps.check.outputs.REGRESSION == 'true'
        run: |
          echo "::error::Performance regression detected! See benchmark-results artifact for details."
          echo "::error::To update baseline, run: pnpm bench:ci --save-baseline results/baseline.json"
          exit 1
