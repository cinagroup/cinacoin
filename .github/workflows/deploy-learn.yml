name: Deploy Learn to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/learn/**'
      - '.github/workflows/deploy-learn.yml'
  pull_request:
    paths:
      - 'apps/learn/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        working-directory: apps/learn
        run: npm ci

      - name: Build
        working-directory: apps/learn
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/learn/out --project-name=cinacoin-learn

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 Learn preview deployed: https://cinacoin-learn.pages.dev'
            })
