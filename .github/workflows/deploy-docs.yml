name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/docs-site/**"
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  # ── Build & Preview ──────────────────────────────────────────
  build:
    name: Build Docusaurus Docs
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.verify.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/docs-site
        run: npm ci

      - name: Build Docusaurus site
        working-directory: apps/docs-site
        run: npm run build

      - name: Verify build output
        id: verify
        working-directory: apps/docs-site
        run: |
          echo "Checking build output..."
          if [ -d "build" ]; then
            echo "✓ Build output found at build/"
            echo "Total size: $(du -sh build | cut -f1)"
            echo "Files: $(find build -type f | wc -l)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ Build output not found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy to Cloudflare Pages ───────────────────────────────
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://cinacoin.com/docs/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/docs-site
        run: npm ci

      - name: Build Docusaurus site
        working-directory: apps/docs-site
        run: npm run build

      - name: Prepare deployment directory
        run: |
          # Docusaurus with baseUrl: '/docs/' generates correct asset paths
          # Router strips /docs prefix before proxying to Pages
          # trailingSlash: false prevents 308 redirects that lose the /docs/ prefix
          rm -rf apps/docs-site/dist_deploy
          cp -r apps/docs-site/build apps/docs-site/dist_deploy
          test -f apps/docs-site/dist_deploy/index.html || { echo "✗ index missing"; exit 1; }
          echo "✓ deployment ready"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: wrangler pages deploy apps/docs-site/dist_deploy --project-name=cinacoin-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea

      - name: Deployment Summary
        run: |
          echo "## 📚 Docs Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
