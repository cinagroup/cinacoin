name: Deploy Demo React to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/demo-react/**"
      - "packages/**"
      - ".github/workflows/deploy-demo-react.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build & Deploy Demo React
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-demo-react-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Demo React
        run: |
          rm -rf apps/demo-react/dist
          rm -rf apps/demo-react/node_modules/.vite
          rm -rf cache/
          pnpm --filter cinacoin-demo-react build
        env:
          NODE_ENV: production

      - name: Verify Output
        run: |
          test -f apps/demo-react/dist/index.html || { echo "✗ dist/index.html missing"; exit 1; }
          echo "✓ static output exists"

      - name: Clean cache before deploy
        run: |
          rm -rf apps/demo-react/dist/.vite
          rm -rf cache/
          echo "Cache cleaned"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy apps/demo-react/dist --project-name=cinacoin-demo-react --branch=main
        env:
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
