name: Deploy Farcaster App

on:
  push:
    branches: [main]
    paths:
      - 'apps/farcaster-app/**'
      - '.github/workflows/deploy-farcaster-app.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/farcaster-app

      - name: Build
        run: npm run build
        working-directory: apps/farcaster-app

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=cinacoin-farcaster
