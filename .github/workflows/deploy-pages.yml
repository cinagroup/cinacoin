name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - website
          - demo
          - backend-dashboard
          - analytics-dashboard
          - cloud-dashboard
          - health-status
          - wallet-explorer
          - unified-dashboard

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed apps
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.app }}" = "all" ]; then
              echo 'apps=["website","demo","backend-dashboard","analytics-dashboard","cloud-dashboard","health-status","wallet-explorer","unified-dashboard"]' >> $GITHUB_OUTPUT
            else
              echo 'apps=["${{ github.event.inputs.app }}"]' >> $GITHUB_OUTPUT
            fi
          else
            # Detect changed apps from git diff
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- apps/ | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "apps=${CHANGED}" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]' && needs.detect-changes.outputs.apps != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
      fail-fast: false
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: https://api.cinacoin.com
          NEXT_PUBLIC_WS_URL: wss://ws.cinacoin.com

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        working-directory: apps/${{ matrix.app }}
        run: |
          wrangler pages deploy .vercel/output/static \
            --project-name=cinacoin-${{ matrix.app }} \
            --branch=${{ github.head_ref || github.ref_name }} \
            --commit-hash=${{ github.sha }}

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `☁️ **${{ matrix.app }}** deployed to Cloudflare Pages\n\n🔗 Preview: https://cinacoin-${{ matrix.app }}.pages.dev`
            })
