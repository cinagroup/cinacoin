name: Quality Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript Compilation ──────────────────────────────────────────────
  typescript:
    name: TypeScript Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

  # ── ESLint ──────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  # ── Unit Tests + Coverage ───────────────────────────────────────────────
  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          # Fail if coverage drops below 60%
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct' 2>/dev/null || echo "0")
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

  # ── E2E Tests ───────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [typescript, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Build Validation ────────────────────────────────────────────────────
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all package builds
        run: npx tsx scripts/validate-build.ts --verbose

      - name: Verify package exports
        run: npx tsx scripts/verify-exports.ts --verbose

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-validation
          path: |
            build-validation.json
            benchmarks/results/exports-report.*
          retention-days: 7

  # ── Performance Benchmarks ──────────────────────────────────────────────
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Need previous commit for comparison

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Download baseline (if exists)
        uses: actions/cache@v6
        with:
          path: benchmarks/baseline.json
          key: benchmark-baseline-${{ github.ref }}
          restore-keys: |
            benchmark-baseline-

      - name: Run benchmarks (CI mode)
        run: |
          npx tsx scripts/run-benchmarks.ts \
            --ci \
            --baseline-file benchmarks/baseline.json \
            --regression-threshold 20 \
            --output-dir benchmarks/results

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 30

      - name: Update baseline (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npx tsx scripts/run-benchmarks.ts \
            --save-baseline benchmarks/baseline.json \
            --output-dir benchmarks/results

      - name: Commit updated baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline.json
          git diff --staged --quiet || git commit -m "chore: update benchmark baseline [skip ci]"
          git push

  # ── Package Size Check ──────────────────────────────────────────────────
  size-check:
    name: Package Size Check
    runs-on: ubuntu-latest
    needs: [build-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check bundle sizes
        run: pnpm check-bundle --verbose

      - name: Comment PR with size changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('bundle-size-report.json', 'utf-8'));
            
            let comment = '## 📦 Bundle Size Report\n\n';
            comment += '| Package | Size | Change |\n';
            comment += '|---------|-----:|-------:|\n';
            
            for (const pkg of report.packages) {
              const icon = pkg.change > 0 ? '📈' : pkg.change < 0 ? '📉' : '➡️';
              comment += `| ${pkg.name} | ${pkg.sizeKB}KB | ${icon} ${pkg.change > 0 ? '+' : ''}${pkg.change}KB |\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ── Dependency Check ────────────────────────────────────────────────────
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Check outdated dependencies
        run: npx tsx scripts/check-deps.ts --json > benchmarks/results/dep-report.json || true

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: benchmarks/results/dep-report.*
          retention-days: 7

  # ── Quality Gate Summary ────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [typescript, lint, test, e2e, build-validation, benchmarks, size-check, dependency-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Checking quality gate results..."
          
          FAILED=0
          
          # Critical checks (must pass)
          if [ "${{ needs.typescript.result }}" != "success" ]; then
            echo "❌ TypeScript compilation failed"
            FAILED=1
          fi
          
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ ESLint failed"
            FAILED=1
          fi
          
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            FAILED=1
          fi
          
          if [ "${{ needs.build-validation.result }}" != "success" ]; then
            echo "❌ Build validation failed"
            FAILED=1
          fi
          
          # Non-critical checks (warnings only)
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "⚠️  E2E tests failed (non-blocking)"
          fi
          
          if [ "${{ needs.benchmarks.result }}" != "success" ]; then
            echo "⚠️  Benchmarks failed or regressed (non-blocking)"
          fi
          
          if [ "${{ needs.size-check.result }}" != "success" ]; then
            echo "⚠️  Size check failed (non-blocking)"
          fi
          
          if [ "${{ needs.dependency-check.result }}" != "success" ]; then
            echo "⚠️  Dependency check failed (non-blocking)"
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Quality gate FAILED — critical checks did not pass"
            exit 1
          fi
          
          echo ""
          echo "✅ Quality gate PASSED — all critical checks passed"
