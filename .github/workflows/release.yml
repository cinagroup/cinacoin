# Cinacoin Release Workflow
#
# Triggered when a version tag (v*) is pushed to the repository.
# This workflow:
#   1. Runs the full test suite
#   2. Builds all packages (npm, Android, iOS, .NET)
#   3. Publishes to npm, Maven Central, CocoaPods, and NuGet
#   4. Creates a GitHub Release with auto-generated changelog
#   5. Uploads build artifacts
#
# Tag format: v<semver> (e.g., v1.1.0, v0.2.1)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Verify — run tests and build
  # ──────────────────────────────────────────────
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  # ──────────────────────────────────────────────
  # Job 2: Publish npm packages
  # ──────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Output publish status
        run: |
          echo "Published: ${{ steps.changesets.outputs.published }}"
          echo "Published packages: ${{ steps.changesets.outputs.publishedPackages }}"

  # ──────────────────────────────────────────────
  # Job 3: Publish Android AAR to Maven Central
  # ──────────────────────────────────────────────
  publish-android:
    name: Publish Android (Maven Central)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Import GPG Signing Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.ANDROID_GPG_PASSPHRASE }}
          git_user_signingkey: false
          git_commit_gpgsign: false

      - name: Build AAR
        working-directory: packages/android-kotlin
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish to Maven Central
        working-directory: packages/android-kotlin
        run: |
          ./gradlew publishReleasePublicationToSonatypeRepository --no-daemon
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.ANDROID_SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_GPG_PASSPHRASE }}

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: packages/android-kotlin/build/outputs/aar/
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 4: Publish iOS to CocoaPods
  # ──────────────────────────────────────────────
  publish-ios:
    name: Publish iOS (CocoaPods)
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build XCFramework
        working-directory: packages/ios-swift
        run: |
          xcodebuild -scheme OnChainUX -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES ONLY_ACTIVE_ARCH=NO clean build
          xcodebuild -scheme OnChainUX -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES ONLY_ACTIVE_ARCH=NO clean build

      - name: Validate podspec
        working-directory: packages/ios-swift
        run: pod spec lint --allow-warnings

      - name: Publish to CocoaPods trunk
        working-directory: packages/ios-swift
        run: pod trunk push --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 5: Publish .NET to NuGet
  # ──────────────────────────────────────────────
  publish-dotnet:
    name: Publish .NET (NuGet)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack
        working-directory: packages/dotnet
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet pack -c Release --no-build -o ./nupkg

      - name: Publish to NuGet
        working-directory: packages/dotnet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-nupkg
          path: packages/dotnet/nupkg/
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 6: GitHub Release — create release with notes
  # ──────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [verify, publish-npm, publish-android, publish-ios, publish-dotnet]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-rc') || contains(steps.version.outputs.version, '-alpha') || contains(steps.version.outputs.version, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 7: Documentation — build and verify docs
  # ──────────────────────────────────────────────
  docs-build:
    name: Build Documentation
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm run docs:build

      - name: Generate TypeDoc
        run: pnpm run typedoc

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/.vitepress/dist/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 8: Bundle size check
  # ──────────────────────────────────────────────
  bundle-size:
    name: Check Bundle Sizes
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check bundle sizes
        run: pnpm run check-bundle
