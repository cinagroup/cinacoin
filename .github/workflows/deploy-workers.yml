name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'packages/relay-server/cloudflare/**'
      - 'packages/push-server/cloudflare/**'
      - 'packages/keys-server/cloudflare/**'
      - 'packages/notify-server/cloudflare/**'
      - 'packages/rpc-proxy/cloudflare/**'
      - '.github/workflows/deploy-workers.yml'

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-workers-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean cache before deploy
        run: |
          rm -rf cache/
          echo "Cache cleaned"

      - name: Deploy relay-server
        working-directory: packages/relay-server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea

      - name: Deploy push-server
        working-directory: packages/push-server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea

      - name: Deploy keys-server
        working-directory: packages/keys-server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea

      - name: Deploy notify-server
        working-directory: packages/notify-server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea

      - name: Deploy rpc-proxy
        working-directory: packages/rpc-proxy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
