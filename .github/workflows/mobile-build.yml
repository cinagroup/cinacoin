name: Mobile SDK Build Checks

on:
  push:
    branches: [main]
    paths:
      - "packages/android-kotlin/**"
      - "packages/flutter-dart/**"
      - "packages/ios-swift/**"
      - "packages/dotnet/**"
      - "packages/unity-csharp/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/android-kotlin/**"
      - "packages/flutter-dart/**"
      - "packages/ios-swift/**"
      - "packages/dotnet/**"
      - "packages/unity-csharp/**"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Android: Lint ─────────────────────────────────────────────
  android-lint:
    name: Android — Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-kotlin
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/android-kotlin/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Check for Gradle wrapper
        id: wrapper-check
        run: |
          if [ -f gradlew ]; then
            echo "WRAPPER_EXISTS=true" >> "$GITHUB_OUTPUT"
          elif [ -f ../../gradlew ]; then
            echo "WRAPPER_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "WRAPPER_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Gradle (no wrapper)
        if: steps.wrapper-check.outputs.WRAPPER_EXISTS == 'false'
        run: |
          GRADLE_VERSION=$(grep gradleVersion= gradle.properties 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.7"
          fi
          if [ ! -f "${HOME}/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-bin" ]; then
            cd /tmp && curl -fSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
            unzip -q gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          fi

      - name: Run Lint
        run: |
          if [ -f gradlew ]; then
            ./gradlew lint
          elif [ -f ../../gradlew ]; then
            ../../gradlew lint
          else
            gradle lint
          fi

  # ── Android: Kotlin Compile Check ─────────────────────────────
  kotlin-compile-check:
    name: Android — Kotlin Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-kotlin
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/android-kotlin/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Check for Gradle wrapper
        id: wrapper-check
        run: |
          if [ -f gradlew ]; then
            echo "WRAPPER_EXISTS=true" >> "$GITHUB_OUTPUT"
          elif [ -f ../../gradlew ]; then
            echo "WRAPPER_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "WRAPPER_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Gradle (no wrapper)
        if: steps.wrapper-check.outputs.WRAPPER_EXISTS == 'false'
        run: |
          GRADLE_VERSION=$(grep gradleVersion= gradle.properties 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.7"
          fi
          if [ ! -f "${HOME}/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-bin" ]; then
            cd /tmp && curl -fSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
            unzip -q gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          fi

      - name: Compile Kotlin
        run: |
          if [ -f gradlew ]; then
            ./gradlew compileDebugKotlin
          elif [ -f ../../gradlew ]; then
            ../../gradlew compileDebugKotlin
          else
            gradle compileDebugKotlin
          fi

  # ── Flutter: Analyze ──────────────────────────────────────────
  flutter-analyze:
    name: Flutter — Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter-dart
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          cache: true
          cache-key: flutter-${{ hashFiles('packages/flutter-dart/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

  # ── iOS: Swift Syntax Check ──────────────────────────────────
  swift-syntax-check:
    name: iOS — Swift SPM Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/ios-swift
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift SPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/ios-swift/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (syntax check)
        run: swift build --build-tests

  # ── .NET: Compile Check ───────────────────────────────────────
  csharp-compile-check:
    name: .NET — Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('packages/dotnet/Cinacoin.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build .NET SDK
        working-directory: packages/dotnet
        run: dotnet build --no-incremental --configuration Release

      - name: Build Unity SDK (if .csproj exists)
        working-directory: packages/unity-csharp
        run: |
          CSPROJ=$(find . -maxdepth 1 -name '*.csproj' | head -1)
          if [ -n "$CSPROJ" ]; then
            dotnet build "$CSPROJ" --no-incremental --configuration Release
          else
            echo "No .csproj found in packages/unity-csharp — skipping Unity build."
          fi
        continue-on-error: true

  # ── Summary ───────────────────────────────────────────────────
  mobile-build-summary:
    name: Mobile SDK — Build Summary
    runs-on: ubuntu-latest
    needs: [android-lint, kotlin-compile-check, flutter-analyze, swift-syntax-check, csharp-compile-check]
    if: always()
    steps:
      - name: Generate summary report
        env:
          ANDROID_LINT: ${{ needs.android-lint.result }}
          KOTLIN_COMPILE: ${{ needs.kotlin-compile-check.result }}
          FLUTTER_ANALYZE: ${{ needs.flutter-analyze.result }}
          SWIFT_SYNTAX: ${{ needs.swift-syntax-check.result }}
          CSHARP_COMPILE: ${{ needs.csharp-compile-check.result }}
        run: |
          echo "## Mobile SDK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ------ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| android-lint | $ANDROID_LINT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| kotlin-compile-check | $KOTLIN_COMPILE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| flutter-analyze | $FLUTTER_ANALYZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| swift-syntax-check | $SWIFT_SYNTAX |" >> "$GITHUB_STEP_SUMMARY"
          echo "| csharp-compile-check | $CSHARP_COMPILE |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          FAILED=""
          if [ "$ANDROID_LINT" = "failure" ] || [ "$ANDROID_LINT" = "cancelled" ]; then
            FAILED="${FAILED}android-lint "
          fi
          if [ "$KOTLIN_COMPILE" = "failure" ] || [ "$KOTLIN_COMPILE" = "cancelled" ]; then
            FAILED="${FAILED}kotlin-compile-check "
          fi
          if [ "$FLUTTER_ANALYZE" = "failure" ] || [ "$FLUTTER_ANALYZE" = "cancelled" ]; then
            FAILED="${FAILED}flutter-analyze "
          fi
          if [ "$SWIFT_SYNTAX" = "failure" ] || [ "$SWIFT_SYNTAX" = "cancelled" ]; then
            FAILED="${FAILED}swift-syntax-check "
          fi
          if [ "$CSHARP_COMPILE" = "failure" ] || [ "$CSHARP_COMPILE" = "cancelled" ]; then
            FAILED="${FAILED}csharp-compile-check "
          fi
          if [ -n "$FAILED" ]; then
            echo "❌ Failed jobs: $FAILED"
            exit 1
          else
            echo "✅ All mobile SDK build checks passed"
            exit 0
          fi
