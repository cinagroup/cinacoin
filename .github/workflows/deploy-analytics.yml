name: Deploy Analytics to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/analytics-dashboard/**"
      - "packages/**"
      - ".github/workflows/deploy-analytics.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build & Deploy Analytics
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-analytics-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build analytics (static export)
        run: |
          rm -rf apps/analytics-dashboard/.next
          rm -rf apps/analytics-dashboard/out
          pnpm --filter analytics-dashboard build
        env:
          NODE_ENV: production

      - name: Verify static output
        run: |
          test -f apps/analytics-dashboard/out/index.html || { echo "✗ out/index.html missing"; exit 1; }
          echo "✓ static output exists"

      - name: Nest output under /analytics (basePath layout)
        run: |
          rm -rf apps/analytics-dashboard/out_deploy
          mkdir -p apps/analytics-dashboard/out_deploy/analytics
          cp -r apps/analytics-dashboard/out/. apps/analytics-dashboard/out_deploy/analytics/
          if [ -f apps/analytics-dashboard/out/_redirects ]; then
            cp apps/analytics-dashboard/out/_redirects apps/analytics-dashboard/out_deploy/_redirects
          fi
          test -f apps/analytics-dashboard/out_deploy/analytics/index.html || { echo "✗ nested index missing"; exit 1; }
          echo "✓ nested output at /analytics"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy apps/analytics-dashboard/out_deploy --project-name=cinacoin-analytics --branch=main
        env:
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7ea8e46d8210bad342fa7595f7935fea
