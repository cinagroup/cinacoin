# Cinacoin — Monitoring Worker Deployment
# Deploys the monitoring Worker to Cloudflare on changes

name: Deploy Monitoring Worker

on:
  push:
    branches: [main]
    paths:
      - 'packages/monitoring/**'
      - '.github/workflows/monitoring.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy Monitoring Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy monitoring Worker
        working-directory: packages/monitoring
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Waiting for deployment propagation..."
          sleep 15

          # Test health endpoint
          HEALTH=$(curl -sf "https://monitor.cinacoin.com/health" || echo "FAIL")
          if [ "$HEALTH" = "FAIL" ]; then
            echo "::warning::Health check failed after deployment"
            exit 1
          fi

          STATUS=$(echo "$HEALTH" | jq -r '.status' 2>/dev/null || echo "unknown")
          echo "Health status: $STATUS"

          # Send notification to Discord if configured
          if [ -n "${{ secrets.MONITORING_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.MONITORING_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg msg "✅ Monitoring Worker deployed successfully (status: $STATUS)" '{content: $msg}')"
          fi

  health-check:
    name: Scheduled Health Check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run health checks
        run: |
          SERVICES=("rpc-proxy:https://rpc.cinacoin.com/health"
                    "keys-server:https://keys.cinacoin.com/health"
                    "relay-server:https://relay.cinacoin.com/health"
                    "notify-server:https://notify.cinacoin.com/health"
                    "push-server:https://push.cinacoin.com/health")

          UNHEALTHY=0
          for svc in "${SERVICES[@]}"; do
            NAME="${svc%%:*}"
            URL="${svc##*:}"

            echo -n "Checking $NAME... "
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ OK ($HTTP_CODE)"
            else
              echo "❌ FAIL ($HTTP_CODE)"
              UNHEALTHY=$((UNHEALTHY + 1))
            fi
          done

          echo ""
          echo "Results: $((5 - UNHEALTHY))/5 healthy"

          if [ $UNHEALTHY -gt 0 ]; then
            echo "::warning::$UNHEALTHY service(s) unhealthy"
            # Send Discord alert
            if [ -n "${{ secrets.MONITORING_WEBHOOK_URL }}" ]; then
              curl -s -X POST "${{ secrets.MONITORING_WEBHOOK_URL }}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg count "$UNHEALTHY" '{
                  embeds: [{
                    title: "🚨 Health Check Alert",
                    description: ([$count, " service(s) failed health check"] | join("")),
                    color: 16711680,
                    timestamp: (now | todate)
                  }]
                }')"
            fi
            exit 1
          fi
