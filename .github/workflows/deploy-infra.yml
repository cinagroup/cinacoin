name: Deploy Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/rpc-proxy/**'
      - 'packages/relay-server/**'
      - 'packages/keys-server/**'
      - 'packages/push-server/**'
      - 'packages/notify-server/**'
      - 'packages/analytics-server/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/rpc-proxy/**'
      - 'packages/relay-server/**'
      - 'packages/keys-server/**'
      - 'packages/push-server/**'
      - 'packages/notify-server/**'
      - 'packages/analytics-server/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (rpc-proxy, relay-server, keys-server, push-server, notify-server, analytics-server, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - rpc-proxy
          - relay-server
          - keys-server
          - push-server
          - notify-server
          - analytics-server
          - all
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  WRANGLER_VERSION: '3.x'

jobs:
  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'all' && format('["{0}"]', github.event.inputs.service) || '["rpc-proxy","relay-server","keys-server","push-server","notify-server","analytics-server"]') }}
      fail-fast: false
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}

      - name: Check if service changed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            # Check if service directory changed in this push
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -c "^packages/${{ matrix.service }}/" || true)
            if [[ $CHANGED -gt 0 ]]; then
              echo "deploy=true" >> $GITHUB_OUTPUT
            else
              echo "deploy=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd packages/${{ matrix.service }}
          
          # Determine wrangler config based on environment
          ENVIRONMENT="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}"
          
          if [[ "$ENVIRONMENT" == "production" ]]; then
            CONFIG="wrangler.production.toml"
            if [[ -f "$CONFIG" ]]; then
              wrangler deploy --config "$CONFIG"
            else
              wrangler deploy
            fi
          else
            wrangler deploy --env staging
          fi

      - name: Health check
        if: steps.check.outputs.deploy == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          ENVIRONMENT="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}"
          
          # Map service to health endpoint
          case "$SERVICE" in
            rpc-proxy)
              URL="https://rpc${ENVIRONMENT:+-$ENVIRONMENT}.cinacoin.com/health"
              ;;
            relay-server)
              URL="https://relay${ENVIRONMENT:+-$ENVIRONMENT}.cinacoin.com/health"
              ;;
            keys-server)
              URL="https://keys${ENVIRONMENT:+-$ENVIRONMENT}.cinacoin.com/health"
              ;;
            push-server)
              URL="https://push${ENVIRONMENT:+-$ENVIRONMENT}.cinacoin.com/health"
              ;;
            notify-server)
              URL="https://notify${ENVIRONMENT:+-$ENVIRONMENT}.cinacoin.com/health"
              ;;
            analytics-server)
              URL="https://analytics${ENVIRONMENT:+-$ENVIRONMENT}.cinacoin.com/health"
              ;;
          esac
          
          echo "Health check: $URL"
          for i in {1..5}; do
            if curl -f -s "$URL" > /dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.check.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "⚠️ Deployment failed, attempting rollback..."
          cd packages/${{ matrix.service }}
          
          ENVIRONMENT="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}"
          
          if [[ "$ENVIRONMENT" == "production" ]]; then
            CONFIG="wrangler.production.toml"
            if [[ -f "$CONFIG" ]]; then
              wrangler versions rollback --config "$CONFIG" --auto || echo "Rollback failed or no previous version"
            else
              wrangler versions rollback --auto || echo "Rollback failed or no previous version"
            fi
          else
            wrangler versions rollback --env staging --auto || echo "Rollback failed or no previous version"
          fi
          
          echo "✅ Rollback completed"

  # ─── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    needs: [test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ **Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          for service in rpc-proxy relay-server keys-server push-server notify-server analytics-server; do
            result="${{ needs.deploy.result }}"
            if [[ "$result" == "success" ]]; then
              echo "- ✅ $service" >> $GITHUB_STEP_SUMMARY
            elif [[ "$result" == "failure" ]]; then
              echo "- ❌ $service (rolled back)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⏭️ $service (skipped)" >> $GITHUB_STEP_SUMMARY
            fi
          done
