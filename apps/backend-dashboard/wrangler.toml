name = "backend-dashboard"
compatibility_date = "2025-01-01"

[build]
command = "pnpm install --frozen-lockfile && npx turbo run build --filter=backend-dashboard"
cwd = "../.."
output_directory = "apps/backend-dashboard/out"
watch_dir = "apps/backend-dashboard/src"

[env.production]
name = "backend-dashboard"

[env.preview]
name = "backend-dashboard-preview"
