name: demo_flutter
description: Cinacoin Flutter SDK Demo App — Showcases wallet connection, signing, chains, and transactions.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Cinacoin SDK (local path for development)
  cinacoin:
    path: ../../packages/flutter-dart

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
