name = "cinacoin-developer-dashboard"
compatibility_date = "2025-01-01"
pages_build_output_dir = "out"

[vars]
NEXT_PUBLIC_API_URL = "https://api.cinacoin.com"
NEXT_PUBLIC_WS_URL = "wss://ws.cinacoin.com"
NEXT_PUBLIC_APP_NAME = "Cinacoin Developer Dashboard"

# D1 Database binding for user data
[[d1_databases]]
binding = "DB"
database_name = "cinacoin-users"
database_id = ""  # Set after creating: wrangler d1 create cinacoin-users

# KV namespace for session storage
[[kv_namespaces]]
binding = "SESSION_KV"
id = ""  # Set after creating: wrangler kv:namespace create SESSION_KV
