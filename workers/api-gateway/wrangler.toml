name = "cinacoin-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom Domain
[[routes]]
pattern = "api.cinacoin.com"
zone_name = "cinacoin.com"

# KV Namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "dceb86e5cb4c4a008013c8cf21d7181c"

# KV Namespace for A/B testing & analytics
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "7d875f79c8c745b2bc4b313062b8be88"

# Service Bindings
[[services]]
binding = "AUTH_SERVICE"
service = "cinacoin-auth"

[[services]]
binding = "USER_SERVICE"
service = "cinacoin-users"

[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
