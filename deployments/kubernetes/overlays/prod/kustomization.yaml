# Production Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cinacoin-prod

namePrefix: prod-

resources:
  - ../../base

patches:
  # Increase replicas for production
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: user-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: unified-dashboard
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  
  # Increase resources for production
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
  
  # Use production config
  - target:
      kind: ConfigMap
      name: cinacoin-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "warn"

commonLabels:
  environment: production

configMapGenerator:
  - name: production-env
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - RATE_LIMIT_MAX_REQUESTS=200

secretGenerator:
  - name: production-secrets
    envs:
      - .env.production
