# Unified Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-dashboard
  namespace: cinacoin
  labels:
    app.kubernetes.io/name: unified-dashboard
    app.kubernetes.io/part-of: cinacoin-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-dashboard
        app.kubernetes.io/part-of: cinacoin-platform
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: default
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: unified-dashboard
          image: cinacoin/unified-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: NODE_ENV
            - name: PORT
              value: "3002"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: LOG_LEVEL
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: API_GATEWAY_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: AUTH_SERVICE_URL
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: USER_SERVICE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Unified Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: unified-dashboard
  namespace: cinacoin
  labels:
    app.kubernetes.io/name: unified-dashboard
    app.kubernetes.io/part-of: cinacoin-platform
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: unified-dashboard
