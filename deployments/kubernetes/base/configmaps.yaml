# Cinacoin Platform - ConfigMaps
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinacoin-config
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
data:
  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Service URLs (internal cluster DNS)
  AUTH_SERVICE_URL: "http://auth-service.cinacoin.svc.cluster.local:3000"
  USER_SERVICE_URL: "http://user-service.cinacoin.svc.cluster.local:3001"
  API_GATEWAY_URL: "http://api-gateway.cinacoin.svc.cluster.local:8000"
  
  # Database Configuration
  POSTGRES_HOST: "postgres.cinacoin.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_POOL_MIN: "5"
  POSTGRES_POOL_MAX: "20"
  POSTGRES_SSL: "false"
  
  # Redis Configuration
  REDIS_HOST: "redis.cinacoin.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # JWT Configuration
  JWT_EXPIRY: "1h"
  REFRESH_TOKEN_EXPIRY: "7d"
  JWT_ALGORITHM: "RS256"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  
  # CORS Configuration
  CORS_ORIGINS: "https://cinacoin.com,https://cloud.cinacoin.com,https://dash.cinacoin.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
    app.kubernetes.io/component: api-gateway
data:
  KONG_DATABASE: "off"
  KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
  KONG_PROXY_ACCESS_LOG: "/dev/stdout"
  KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
  KONG_PROXY_ERROR_LOG: "/dev/stderr"
  KONG_ADMIN_ERROR_LOG: "/dev/stderr"
  KONG_PROXY_LISTEN: "0.0.0.0:8000 reuseport backlog=16384, 0.0.0.0:8443 http2 ssl reuseport backlog=16384"
  KONG_ADMIN_LISTEN: "127.0.0.1:8001"
  KONG_NGINX_WORKER_PROCESSES: "2"
  KONG_NGINX_WORKER_CONNECTIONS: "8192"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
    app.kubernetes.io/component: api-gateway
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    
    plugins:
      - name: cors
        config:
          origins: ["https://cinacoin.com", "https://cloud.cinacoin.com", "https://dash.cinacoin.com"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Auth-Token", "Authorization"]
          exposed_headers: ["X-Auth-Token"]
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 100
          hour: 5000
          policy: local
          limit_by: ip
          fault_tolerant: true
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Gateway-Version:1.0.0"

    services:
      - name: auth-service
        url: http://auth-service.cinacoin.svc.cluster.local:3000
        routes:
          - name: auth-routes
            paths: ["/auth", "/api/auth"]
            strip_path: false
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: ["exp"]
          - name: correlation-id
            config:
              header_name: X-Request-ID
              generator: uuid

      - name: user-service
        url: http://user-service.cinacoin.svc.cluster.local:3001
        routes:
          - name: user-routes
            paths: ["/users", "/api/users"]
            strip_path: false
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: ["exp"]
          - name: correlation-id
            config:
              header_name: X-Request-ID
              generator: uuid

      - name: health-service
        url: http://auth-service.cinacoin.svc.cluster.local:3000
        routes:
          - name: health-routes
            paths: ["/health", "/api/health"]
            strip_path: false
            methods: ["GET"]
