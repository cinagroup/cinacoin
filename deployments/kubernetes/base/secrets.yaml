# Cinacoin Platform - Secrets
# NOTE: In production, use sealed-secrets or external secret management (Vault, AWS Secrets Manager)
apiVersion: v1
kind: Secret
metadata:
  name: cinacoin-db-credentials
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
type: Opaque
stringData:
  POSTGRES_USER: cinacoin
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"  # Replace via Kustomize or external secret
  POSTGRES_AUTH_DB: cinacoin_auth
  POSTGRES_PROJECT_DB: cinacoin_project
  POSTGRES_WALLET_DB: cinacoin_wallet
---
apiVersion: v1
kind: Secret
metadata:
  name: cinacoin-redis-credentials
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
type: Opaque
stringData:
  REDIS_PASSWORD: "${REDIS_PASSWORD}"  # Replace via Kustomize or external secret
---
apiVersion: v1
kind: Secret
metadata:
  name: cinacoin-jwt-secret
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
type: Opaque
stringData:
  JWT_SECRET: "${JWT_SECRET}"  # Replace via Kustomize or external secret
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"  # Replace via Kustomize or external secret
---
apiVersion: v1
kind: Secret
metadata:
  name: cinacoin-tls-secret
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin-platform
type: kubernetes.io/tls
data:
  tls.crt: "${TLS_CERT_BASE64}"  # Replace with actual cert
  tls.key: "${TLS_KEY_BASE64}"   # Replace with actual key
