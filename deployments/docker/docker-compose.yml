# Cinacoin Platform - Local Development Docker Compose
# Usage: docker compose up -d

version: '3.9'

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  
  postgres:
    image: postgres:16-alpine
    container_name: cinacoin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinacoin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinacoin_dev_2026}
      POSTGRES_DB: cinacoin_auth
      POSTGRES_MULTIPLE_DATABASES: cinacoin_auth,cinacoin_project,cinacoin_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinacoin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinacoin-net

  redis:
    image: redis:7-alpine
    container_name: cinacoin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-cinacoin_redis_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cinacoin_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinacoin-net

  # ============================================
  # Application Services
  # ============================================

  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: ../../deployments/docker/Dockerfile.auth-service
    container_name: cinacoin-auth
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://cinacoin:${POSTGRES_PASSWORD:-cinacoin_dev_2026}@postgres:5432/cinacoin_auth
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinacoin_redis_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRY: 1h
      REFRESH_TOKEN_EXPIRY: 7d
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cinacoin-net

  user-service:
    build:
      context: ../../apps/user-service
      dockerfile: ../../deployments/docker/Dockerfile.user-service
    container_name: cinacoin-user
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://cinacoin:${POSTGRES_PASSWORD:-cinacoin_dev_2026}@postgres:5432/cinacoin_auth
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinacoin_redis_2026}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:3000
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cinacoin-net

  api-gateway:
    build:
      context: ./gateway-config
      dockerfile: ../Dockerfile.api-gateway
    container_name: cinacoin-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"   # Proxy
      - "8443:8443"   # Proxy SSL
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin API SSL
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cinacoin-net

  unified-dashboard:
    build:
      context: ../../apps/unified-dashboard
      dockerfile: ../../deployments/docker/Dockerfile.unified-dashboard
    container_name: cinacoin-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:8000
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3001
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cinacoin-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cinacoin-net:
    driver: bridge
    name: cinacoin-network
