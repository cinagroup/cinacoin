# Kong Gateway Configuration
# Declarative configuration for API routing

_format_version: "3.0"
_transform: true

# ============================================
# Global Plugins
# ============================================
plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Auth-Token", "Authorization"]
      exposed_headers: ["X-Auth-Token"]
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 60
      hour: 1000
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_password: ${REDIS_PASSWORD}
      limit_by: ip
      fault_tolerant: true

  - name: request-transformer
    config:
      add:
        headers:
          - "X-Gateway-Version:1.0.0"
          - "X-Request-Source:api-gateway"

# ============================================
# Services & Routes
# ============================================
services:
  # Auth Service
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-routes
        paths:
          - /auth
          - /api/auth
        strip_path: false
        methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    plugins:
      - name: jwt
        config:
          key_claim_name: kid
          claims_to_verify: ["exp"]
      - name: acl
        config:
          allow: ["authenticated"]
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid

  # User Service
  - name: user-service
    url: http://user-service:3001
    routes:
      - name: user-routes
        paths:
          - /users
          - /api/users
        strip_path: false
        methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    plugins:
      - name: jwt
        config:
          key_claim_name: kid
          claims_to_verify: ["exp"]
      - name: acl
        config:
          allow: ["authenticated", "admin"]
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid

  # Health Check (public, no auth)
  - name: health-service
    url: http://auth-service:3000
    routes:
      - name: health-routes
        paths:
          - /health
          - /api/health
        strip_path: false
        methods: ["GET"]

# ============================================
# Consumers (for testing/development)
# ============================================
consumers:
  - username: test-user
    custom_id: test-001
