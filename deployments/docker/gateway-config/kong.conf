# Kong Gateway Production Configuration

# Database mode (off = DB-less, declarative)
database = off

# Declarative configuration
declarative_config = /etc/kong/kong.yml

# Logging
proxy_access_log = /dev/stdout
admin_access_log = /dev/stdout
proxy_error_log = /dev/stderr
admin_error_log = /dev/stderr

# Admin API (restrict in production)
admin_listen = 127.0.0.1:8001
admin_gui_listen = 127.0.0.1:8002

# Proxy listeners
proxy_listen = 0.0.0.0:8000 reuseport backlog=16384
proxy_listen = 0.0.0.0:8443 http2 ssl reuseport backlog=16384

# SSL certificates (use secrets in production)
ssl_cert = /etc/kong/ssl/tls.crt
ssl_cert_key = /etc/kong/ssl/tls.key

# Performance tuning
nginx_worker_processes = auto
nginx_worker_connections = 16384
nginx_http_upstream_keepalive = 256
nginx_http_upstream_keepalive_timeout = 60s

# Security headers
nginx_http_add_header = "X-Frame-Options SAMEORIGIN"
nginx_http_add_header = "X-Content-Type-Options nosniff"
nginx_http_add_header = "X-XSS-Protection \"1; mode=block\""
nginx_http_add_header = "Strict-Transport-Security \"max-age=31536000; includeSubDomains\""

# Timeouts
upstream_keepalive = 256
upstream_keepalive_timeout = 60
nginx_http_keepalive_timeout = 60s

# Rate limiting (Redis backend)
plugins = bundled
redis_host = redis
redis_port = 6379
