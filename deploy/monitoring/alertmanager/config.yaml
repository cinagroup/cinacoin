# Cinacoin — AlertManager Configuration
# Routes alerts to Slack, PagerDuty, and Discord based on severity
---
global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  discord_webhook_url: "https://discord.com/api/webhooks/YOUR/DISCORD/WEBHOOK"

# ── Inhibition Rules ─────────────────────────────────────────
# Prevents duplicate notifications when a critical alert already fires
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - service
      - region
  - source_match:
      severity: critical
    target_match:
      severity: info
    equal:
      - alertname
      - service
  - source_match:
      category: infrastructure
    target_match:
      category: availability
    equal:
      - service
      - instance

# ── Routing Tree ─────────────────────────────────────────────
route:
  receiver: default-receiver
  group_by:
    - alertname
    - service
    - region
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical → PagerDuty + Slack + Discord (immediate page)
    - match:
        severity: critical
      receiver: critical-receiver
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Warning → Slack (team awareness)
    - match:
        severity: warning
      receiver: slack-warning
      repeat_interval: 4h

    # Info → Slack info channel (low noise)
    - match:
        severity: info
      receiver: slack-info
      repeat_interval: 12h

    # SLO-specific routing
    - match:
        category: slo
      receiver: slack-slo
      repeat_interval: 6h

    # Blockchain-specific routing
    - match:
        category: blockchain
      receiver: slack-blockchain
      repeat_interval: 2h

# ── Receivers ────────────────────────────────────────────────
receivers:
  - name: default-receiver
    slack_configs:
      - channel: "#cinacoin-alerts"
        send_resolved: true
        title: '{{ template "cinacoin.title" . }}'
        text: '{{ template "cinacoin.text" . }}'
        actions:
          - type: button
            text: 'Runbook'
            url: '{{ .CommonAnnotations.runbook_url }}'

  - name: critical-receiver
    pagerduty_configs:
      - service_key: "PD_SERVICE_KEY"
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          service: '{{ .CommonLabels.service }}'
          region: '{{ .CommonLabels.region }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
    slack_configs:
      - channel: "#cinacoin-critical"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ template "cinacoin.critical_text" . }}'
        actions:
          - type: button
            text: '🔧 Runbook'
            url: '{{ .CommonAnnotations.runbook_url }}'
          - type: button
            text: '📊 Dashboard'
            url: 'https://grafana.cinacoin.com/d/cinacoin-overview'

  - name: slack-warning
    slack_configs:
      - channel: "#cinacoin-alerts"
        send_resolved: true
        color: 'warning'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ template "cinacoin.text" . }}'

  - name: slack-info
    slack_configs:
      - channel: "#cinacoin-info"
        send_resolved: true
        color: '#439FE0'
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        text: '{{ template "cinacoin.text" . }}'

  - name: slack-slo
    slack_configs:
      - channel: "#cinacoin-slo"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '📊 SLO: {{ .GroupLabels.alertname }}'
        text: '{{ template "cinacoin.text" . }}'

  - name: slack-blockchain
    slack_configs:
      - channel: "#cinacoin-blockchain"
        send_resolved: true
        title: '⛓️ Blockchain: {{ .GroupLabels.alertname }}'
        text: '{{ template "cinacoin.text" . }}'

# ── Templates ────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'
