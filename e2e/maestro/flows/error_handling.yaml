# Error handling and edge cases
appId: com.cinacoin.demo
---
- runFlow: subflows/launch.yaml

# Test 1: Sign without connection
- tapOn: { id: "sign_button" }
- assertVisible: { text: "Please connect wallet first" }
- tapOn: { id: "close_modal" }

# Test 2: Send without connection
- tapOn: { id: "send_button" }
- assertVisible: { text: "Please connect wallet first" }
- tapOn: { id: "close_modal" }

# Test 3: Invalid address format
- tapOn: { id: "connect_button" }
- tapOn: { text: "MetaMask" }
- tapOn: { id: "simulate_connection" }
- tapOn: { id: "send_button" }
- inputText: { id: "recipient", text: "invalid_address" }
- tapOn: { id: "confirm_send" }
- assertVisible: { text: "Invalid address format" }
- tapOn: { id: "close_modal" }

# Test 4: Insufficient balance
- tapOn: { id: "send_button" }
- inputText: { id: "recipient", text: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18" }
- inputText: { id: "amount", text: "999999" }
- tapOn: { id: "confirm_send" }
- assertVisible: { text: "Insufficient balance" }
- tapOn: { id: "close_modal" }

# Test 5: Network switch failure
- tapOn: { id: "chain_selector" }
- tapOn: { text: "Unsupported Chain" }
- assertVisible: { text: "Chain not supported" }
