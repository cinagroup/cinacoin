# Deploy API Gateway to Cloudflare Workers
#
# Triggers on push to main when api-gateway files change.
# Deploys to staging first, then production after manual approval.

name: Deploy API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-gateway/**'
      - '.github/workflows/deploy-api-gateway.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ── Test before deploy ──────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: apps/api-gateway
        run: pnpm typecheck

      - name: Run tests
        working-directory: apps/api-gateway
        run: pnpm test

  # ── Deploy to Staging ───────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://api-staging.cinacoin.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Staging
        working-directory: apps/api-gateway
        run: pnpm deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          sleep 10  # Wait for deployment to propagate
          
          # Health check
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://api-staging.cinacoin.com/health)
          if [ "$HEALTH" != "200" ]; then
            echo "❌ Health check failed: $HEALTH"
            exit 1
          fi
          echo "✅ Health check passed"
          
          # Readiness check
          READY=$(curl -s -o /dev/null -w "%{http_code}" https://api-staging.cinacoin.com/health/ready)
          if [ "$READY" != "200" ]; then
            echo "❌ Readiness check failed: $READY"
            exit 1
          fi
          echo "✅ Readiness check passed"

  # ── Deploy to Production (manual approval required) ─────────
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.cinacoin.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Production
        working-directory: apps/api-gateway
        run: pnpm deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production..."
          sleep 10
          
          # Health check
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://api.cinacoin.com/health)
          if [ "$HEALTH" != "200" ]; then
            echo "❌ Health check failed: $HEALTH"
            exit 1
          fi
          echo "✅ Health check passed"
          
          # Readiness check
          READY=$(curl -s -o /dev/null -w "%{http_code}" https://api.cinacoin.com/health/ready)
          if [ "$READY" != "200" ]; then
            echo "❌ Readiness check failed: $READY"
            exit 1
          fi
          echo "✅ Readiness check passed"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ API Gateway deployed to production successfully"
          echo "Version: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
