name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Deploy Workers
        run: |
          npx wrangler deploy workers/auth-service
          npx wrangler deploy workers/user-service
          npx wrangler deploy workers/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      
      - name: Deploy Pages
        run: |
          # 部署所有前端应用
          for app in website demo backend-dashboard analytics-dashboard cloud-dashboard health-status wallet-explorer unified-dashboard; do
            cd apps/$app
            npm run build
            npx wrangler pages deploy .vercel/output/static --project-name=cinacoin-$app
            cd ../..
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
