name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to migrate'
        required: true
        type: choice
        options:
          - auth-service
          - user-service
          - api-gateway
      dry_run:
        description: 'Dry run (show SQL without executing)'
        required: false
        default: false
        type: boolean

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: '9.15.0'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ github.event.inputs.environment == 'production' && secrets.KUBE_CONFIG_PRODUCTION || secrets.KUBE_CONFIG_STAGING }}
      
      - name: Get database credentials
        id: db-creds
        run: |
          SERVICE=${{ github.event.inputs.service }}
          NAMESPACE=${{ github.event.inputs.environment == 'production' && 'cinacoin' || 'cinacoin-staging' }}
          
          # Get DATABASE_URL from secret
          DATABASE_URL=$(kubectl get secret cinacoin-secrets -n $NAMESPACE -o jsonpath="{.data.${SERVICE//-/_}-database-url}" | base64 -d)
          
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT
      
      - name: Backup database
        if: github.event.inputs.environment == 'production'
        run: |
          SERVICE=${{ github.event.inputs.service }}
          DATABASE_URL="${{ steps.db-creds.outputs.database_url }}"
          BACKUP_FILE="backup-${SERVICE}-$(date +%Y%m%d-%H%M%S).sql"
          
          echo "💾 Creating database backup: $BACKUP_FILE"
          pg_dump "$DATABASE_URL" > "$BACKUP_FILE"
          
          # Upload backup as artifact
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
      
      - name: Upload backup artifact
        if: github.event.inputs.environment == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.event.inputs.service }}-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
      
      - name: Run migration (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          SERVICE=${{ github.event.inputs.service }}
          DATABASE_URL="${{ steps.db-creds.outputs.database_url }}"
          
          echo "🔍 Dry run: Showing migration SQL for $SERVICE"
          
          # Find migration files
          MIGRATION_DIR="apps/$SERVICE/migrations"
          
          for file in "$MIGRATION_DIR"/*.sql; do
            if [ -f "$file" ]; then
              echo ""
              echo "=== $(basename $file) ==="
              cat "$file"
              echo ""
            fi
          done
      
      - name: Run migration
        if: github.event.inputs.dry_run != 'true'
        run: |
          SERVICE=${{ github.event.inputs.service }}
          DATABASE_URL="${{ steps.db-creds.outputs.database_url }}"
          
          echo "🚀 Running migrations for $SERVICE"
          
          cd "apps/$SERVICE"
          DATABASE_URL="$DATABASE_URL" pnpm db:migrate:prod
          
          echo "✅ Migrations completed for $SERVICE"
      
      - name: Verify migration
        if: github.event.inputs.dry_run != 'true'
        run: |
          SERVICE=${{ github.event.inputs.service }}
          DATABASE_URL="${{ steps.db-creds.outputs.database_url }}"
          
          echo "🔍 Verifying migration..."
          
          # Count tables
          TABLE_COUNT=$(psql "$DATABASE_URL" -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" | xargs)
          echo "📊 Total tables: $TABLE_COUNT"
          
          # Show table list
          echo ""
          echo "📋 Tables:"
          psql "$DATABASE_URL" -c "\dt"
      
      - name: Rollback on failure
        if: failure() && github.event.inputs.environment == 'production'
        run: |
          SERVICE=${{ github.event.inputs.service }}
          DATABASE_URL="${{ steps.db-creds.outputs.database_url }}"
          
          echo "❌ Migration failed. Initiating rollback..."
          
          # Restore from backup
          if [ -f "$BACKUP_FILE" ]; then
            echo "🔄 Restoring from backup: $BACKUP_FILE"
            psql "$DATABASE_URL" < "$BACKUP_FILE"
            echo "✅ Rollback completed"
          else
            echo "⚠️ No backup file found. Manual intervention required."
          fi
