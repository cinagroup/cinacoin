name: CD - Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, auth-service, user-service, api-gateway, unified-dashboard)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth-service
          - user-service
          - api-gateway
          - unified-dashboard
      strategy:
        description: 'Deployment strategy'
        required: true
        default: 'rolling'
        type: choice
        options:
          - rolling
          - blue-green
          - canary

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ===========================================================================
  # Pre-deployment Checks
  # ===========================================================================
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check deployment conditions
        id: check
        run: |
          # Skip if commit message contains [skip deploy]
          if [[ "${{ github.event.head_commit.message }}" == *"[skip deploy]"* ]]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping deployment (commit message contains [skip deploy])"
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Proceeding with deployment"
          fi

  # ===========================================================================
  # Deploy to Staging (Blue/Green)
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [pre-deploy]
    if: needs.pre-deploy.outputs.should_deploy == 'true'
    environment: staging
    strategy:
      max-parallel: 1
      matrix:
        service: [auth-service, user-service, api-gateway, unified-dashboard]
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
      
      - name: Deploy to staging
        run: |
          SERVICE=${{ matrix.service }}
          NAMESPACE=cinacoin-staging
          IMAGE_TAG=${{ github.sha }}
          
          echo "🚀 Deploying $SERVICE to staging (tag: $IMAGE_TAG)"
          
          # Update image tag in deployment
          kubectl set image deployment/$SERVICE \
            $SERVICE=$IMAGE_PREFIX/$SERVICE:$IMAGE_TAG \
            -n $NAMESPACE
          
          # Wait for rollout
          kubectl rollout status deployment/$SERVICE -n $NAMESPACE --timeout=300s
          
          echo "✅ $SERVICE deployed to staging"
      
      - name: Run smoke tests
        run: |
          SERVICE=${{ matrix.service }}
          STAGING_URL="https://staging-api.cinacoin.com"
          
          case $SERVICE in
            auth-service)
              curl -f "$STAGING_URL/auth/health" || exit 1
              ;;
            user-service)
              curl -f "$STAGING_URL/api/v1/users/health" || exit 1
              ;;
            api-gateway)
              curl -f "$STAGING_URL/health" || exit 1
              ;;
            unified-dashboard)
              curl -f "https://staging-app.cinacoin.com/" || exit 1
              ;;
          esac
          
          echo "✅ Smoke tests passed for $SERVICE"

  # ===========================================================================
  # Deploy to Production (with strategy)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        service: [auth-service, user-service, api-gateway, unified-dashboard]
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      
      - name: Deploy to production (Rolling)
        if: github.event.inputs.strategy == 'rolling' || github.event_name == 'push'
        run: |
          SERVICE=${{ matrix.service }}
          NAMESPACE=cinacoin
          IMAGE_TAG=${{ github.sha }}
          
          echo "🚀 Deploying $SERVICE to production (rolling update)"
          
          # Update image tag
          kubectl set image deployment/$SERVICE \
            $SERVICE=$IMAGE_PREFIX/$SERVICE:$IMAGE_TAG \
            -n $NAMESPACE
          
          # Wait for rollout
          kubectl rollout status deployment/$SERVICE -n $NAMESPACE --timeout=600s
          
          echo "✅ $SERVICE deployed to production"
      
      - name: Deploy to production (Canary)
        if: github.event.inputs.strategy == 'canary'
        run: |
          SERVICE=${{ matrix.service }}
          NAMESPACE=cinacoin
          IMAGE_TAG=${{ github.sha }}
          
          echo "🐤 Deploying $SERVICE to production (canary)"
          
          # Create canary deployment (10% traffic)
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $SERVICE-canary
            namespace: $NAMESPACE
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: $SERVICE
                track: canary
            template:
              metadata:
                labels:
                  app: $SERVICE
                  track: canary
              spec:
                containers:
                  - name: $SERVICE
                    image: $IMAGE_PREFIX/$SERVICE:$IMAGE_TAG
                    ports:
                      - containerPort: $(kubectl get deployment $SERVICE -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].ports[0].containerPort}')
          EOF
          
          # Wait for canary to be ready
          kubectl rollout status deployment/$SERVICE-canary -n $NAMESPACE --timeout=300s
          
          echo "✅ Canary deployed. Monitor for 5 minutes before promoting."
          sleep 300
          
          # Check canary health
          CANARY_POD=$(kubectl get pod -l app=$SERVICE,track=canary -n $NAMESPACE -o jsonpath='{.items[0].metadata.name}')
          if kubectl exec $CANARY_POD -n $NAMESPACE -- curl -f http://localhost:$(kubectl get deployment $SERVICE -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].ports[0].containerPort}')/health; then
            echo "✅ Canary healthy. Promoting to production..."
            
            # Promote: update main deployment
            kubectl set image deployment/$SERVICE \
              $SERVICE=$IMAGE_PREFIX/$SERVICE:$IMAGE_TAG \
              -n $NAMESPACE
            kubectl rollout status deployment/$SERVICE -n $NAMESPACE --timeout=600s
            
            # Remove canary
            kubectl delete deployment $SERVICE-canary -n $NAMESPACE
            echo "✅ $SERVICE promoted to production"
          else
            echo "❌ Canary unhealthy. Rolling back..."
            kubectl delete deployment $SERVICE-canary -n $NAMESPACE
            exit 1
          fi
      
      - name: Verify deployment
        run: |
          SERVICE=${{ matrix.service }}
          NAMESPACE=cinacoin
          PROD_URL="https://api.cinacoin.com"
          
          case $SERVICE in
            auth-service)
              curl -f "$PROD_URL/auth/health" || exit 1
              ;;
            user-service)
              curl -f "$PROD_URL/api/v1/users/health" || exit 1
              ;;
            api-gateway)
              curl -f "$PROD_URL/health" || exit 1
              ;;
            unified-dashboard)
              curl -f "https://app.cinacoin.com/" || exit 1
              ;;
          esac
          
          echo "✅ Production verification passed for $SERVICE"
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 ${{ matrix.service }} successfully deployed to production!"
          # Add Slack/Discord notification here if needed

  # ===========================================================================
  # Post-deployment Monitoring
  # ===========================================================================
  post-deploy:
    name: Post-deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      
      - name: Check pod health
        run: |
          NAMESPACE=cinacoin
          
          echo "📊 Checking pod health..."
          kubectl get pods -n $NAMESPACE -o wide
          
          echo ""
          echo "📊 Checking deployments..."
          kubectl get deployments -n $NAMESPACE
          
          echo ""
          echo "📊 Recent events..."
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' | tail -20
