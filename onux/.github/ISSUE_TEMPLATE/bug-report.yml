name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security vulnerabilities, please follow the process in [SECURITY.md](../../SECURITY.md) instead of filing a public issue.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - SDK / Core library
        - CLI / Tooling
        - Documentation
        - Infrastructure / Deployment
        - Chain adapter (TON, TRON, EVM, etc.)
        - UI / Frontend
        - Tests
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely. What did you expect vs. what actually happened?
      placeholder: When I do X, I expect Y, but Z happens instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps to trigger the bug.
      placeholder: |
        1. Install…
        2. Run…
        3. See error…
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, package version, browser (if applicable).
      placeholder: |
        - OS: macOS 14 / Ubuntu 24.04 / Windows 11
        - Node: v22.x
        - Package version: x.y.z
        - Browser: Chrome 130 (if applicable)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs & output
      description: Paste relevant error messages, stack traces, or logs.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: Did you search for existing reports?
      options:
        - label: I checked existing issues for duplicates
          required: true
