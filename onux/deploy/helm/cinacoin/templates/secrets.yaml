# Cinacoin — Kubernetes Secrets Management Template
# ⚠️ DO NOT store actual secret values here!
# Use Sealed Secrets, External Secrets Operator, or cloud KMS integration.
#
# This template shows the structure for required secrets.
# Actual values should be provided by:
#   - External Secrets Operator (AWS Secrets Manager / GCP Secret Manager)
#   - Sealed Secrets (Bitnami)
#   - Vault Agent Injector
#   - Manual kubectl creation for development only
#
# ⚠️  SECURITY: All default values below are PLACEHOLDERS and MUST be replaced
#     before deployment. Generate strong random values, e.g.:
#       openssl rand -base64 32
#     Or use Helm lookup to auto-generate on first install:
#       {{ (lookup "v1" "Secret" .Release.Namespace "cinacoin-secrets").data | default (dict) }}
#
# Example with External Secrets Operator:
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   spec:
#     secretStoreRef:
#       name: aws-secrets-manager
#       kind: ClusterSecretStore
#     target:
#       name: cinacoin-secrets
#     dataFrom:
#       - extract:
#           key: cinacoin/production
---
apiVersion: v1
kind: Secret
metadata:
  name: cinacoin-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
    component: secrets
type: Opaque
data:
  # ⚠️  MUST BE REPLACED before deployment — generate with: openssl rand -base64 32 | tr -d '\n' | base64
  # Base64-encoded STRONG RANDOM values required. Weak defaults will FAIL in production.
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  database-url: {{ printf "postgresql://cinacoin:%s@postgres-primary:5432/cinacoin" (randAlphaNum 24) | b64enc | quote }}
  jwt-secret: {{ randAlphaNum 48 | b64enc | quote }}
  encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  MUST reference the redis-password from cinacoin-secrets — do NOT hardcode
  url: {{ printf "redis://:%s@redis-cluster:6379" (randAlphaNum 32) | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  Replace with real API keys from provider dashboards
  alchemy: {{ required "alchemy API key is required" .Values.secrets.alchemy | b64enc | quote }}
  infura: {{ required "infura API key is required" .Values.secrets.infura | b64enc | quote }}
  ankr: {{ required "ankr API key is required" .Values.secrets.ankr | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: push-apns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  Replace with real APNs credentials (base64-encoded .p8 key and certificate)
  apns-key-p8: {{ required "APNs key (.p8) is required" .Values.secrets.apnsKeyP8 | b64enc | quote }}
  apns-cert: {{ required "APNs certificate is required" .Values.secrets.apnsCert | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: push-fcm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  Replace with real FCM credentials JSON (base64-encoded)
  fcm-credentials-json: {{ required "FCM credentials JSON is required" .Values.secrets.fcmCredentialsJson | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keys-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  MUST BE REPLACED — generate with: openssl rand -base64 32
  database-url: {{ printf "postgresql://keys:%s@postgres-primary:5432/keys" (randAlphaNum 24) | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keys-encryption
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  CRITICAL: Must be a strong random 32+ byte key. Generate with: openssl rand 32 | base64
  master-key: {{ randAlphaNum 48 | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bundler-wallet
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  CRITICAL: Replace with real bundler private key (hex-encoded, base64-wrapped)
  private-key: {{ required "bundler private key is required" .Values.secrets.bundlerPrivateKey | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinacoin.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️  MUST BE REPLACED — generate with: openssl rand -base64 24
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
