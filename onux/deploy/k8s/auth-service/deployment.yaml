apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cinacoin
  labels:
    app: auth-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
    spec:
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: cinacoin/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3200
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3200"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: auth-database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: jwt-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: session-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: encryption-key
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: service-api-key
            - name: CORS_ORIGINS
              value: "https://cinacoin.com,https://app.cinacoin.com"
            - name: USER_SERVICE_URL
              value: "http://user-service:3201"
            - name: API_GATEWAY_URL
              value: "http://api-gateway:8787"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: log-level
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3200
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cinacoin
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 3200
      targetPort: 3200
      protocol: TCP
      name: http
  selector:
    app: auth-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: cinacoin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
