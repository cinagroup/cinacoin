apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-dashboard
  namespace: cinacoin
  labels:
    app: unified-dashboard
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unified-dashboard
  template:
    metadata:
      labels:
        app: unified-dashboard
        version: v1
    spec:
      serviceAccountName: unified-dashboard
      containers:
        - name: unified-dashboard
          image: cinacoin/unified-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3200"
            - name: USER_SERVICE_URL
              value: "http://user-service:3201"
            - name: API_GATEWAY_URL
              value: "http://api-gateway:8787"
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cinacoin-secrets
                  key: service-api-key
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: app-url
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: api-url
            - name: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: walletconnect-project-id
            - name: NEXT_PUBLIC_MOONPAY_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: cinacoin-config
                  key: moonpay-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: unified-dashboard
  namespace: cinacoin
  labels:
    app: unified-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: unified-dashboard
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-dashboard-hpa
  namespace: cinacoin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-dashboard
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
