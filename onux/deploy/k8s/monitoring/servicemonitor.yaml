apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cinacoin-services-monitor
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin
spec:
  selector:
    matchLabels:
      monitoring: "true"
  namespaceSelector:
    matchNames:
      - cinacoin
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
---
# Add monitoring label to services
apiVersion: v1
kind: Service
metadata:
  name: auth-service-monitored
  namespace: cinacoin
  labels:
    app: auth-service
    monitoring: "true"
spec:
  type: ClusterIP
  ports:
    - port: 3200
      targetPort: 3200
      protocol: TCP
      name: http
  selector:
    app: auth-service
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-monitored
  namespace: cinacoin
  labels:
    app: user-service
    monitoring: "true"
spec:
  type: ClusterIP
  ports:
    - port: 3201
      targetPort: 3201
      protocol: TCP
      name: http
  selector:
    app: user-service
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-monitored
  namespace: cinacoin
  labels:
    app: api-gateway
    monitoring: "true"
spec:
  type: ClusterIP
  ports:
    - port: 8787
      targetPort: 8787
      protocol: TCP
      name: http
  selector:
    app: api-gateway
