apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinacoin-ingress
  namespace: cinacoin
  annotations:
    # Nginx Ingress Controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://cinacoin.com,https://app.cinacoin.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
    
    # Cert Manager (Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cinacoin.com
        - app.cinacoin.com
        - api.cinacoin.com
        - ws.cinacoin.com
      secretName: cinacoin-tls
  rules:
    # Main Dashboard
    - host: app.cinacoin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unified-dashboard
                port:
                  number: 3000
    
    # API Gateway
    - host: api.cinacoin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8787
    
    # Auth Service (if exposed directly)
    - host: api.cinacoin.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3200
          
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3201
          
          - path: /api/v1/teams
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3201
    
    # WebSocket (for real-time features)
    - host: ws.cinacoin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8787
