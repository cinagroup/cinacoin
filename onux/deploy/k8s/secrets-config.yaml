apiVersion: v1
kind: Secret
metadata:
  name: cinacoin-secrets
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin
type: Opaque
stringData:
  # Database URLs
  auth-database-url: "postgresql://cinacoin_auth:CHANGE_ME@postgres:5432/cinacoin_auth"
  user-database-url: "postgresql://cinacoin_users:CHANGE_ME@postgres:5432/cinacoin_users"
  gateway-database-url: "postgresql://cinacoin_gateway:CHANGE_ME@postgres:5432/cinacoin_gateway"
  
  # Redis
  redis-url: "redis://:CHANGE_ME@redis-master:6379/0"
  
  # Security Keys
  jwt-secret: "CHANGE_ME_GENERATE_64_HEX_CHARS"
  session-secret: "CHANGE_ME_GENERATE_64_HEX_CHARS"
  encryption-key: "CHANGE_ME_GENERATE_64_HEX_CHARS"
  service-api-key: "CHANGE_ME_GENERATE_SECURE_KEY"
  
  # RPC Providers
  ethereum-rpc-url: "https://eth-mainnet.g.alchemy.com/v2/CHANGE_ME"
  
  # Bundler
  bundler-api-key: "CHANGE_ME"
  bundler-private-key: "CHANGE_ME"
  
  # Paymaster
  paymaster-api-key: "CHANGE_ME"
  paymaster-private-key: "CHANGE_ME"
  
  # OAuth (optional)
  google-client-id: ""
  google-client-secret: ""
  github-client-id: ""
  github-client-secret: ""
  
  # Monitoring
  sentry-dsn: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinacoin-config
  namespace: cinacoin
  labels:
    app.kubernetes.io/part-of: cinacoin
data:
  # General
  log-level: "info"
  environment: "production"
  
  # URLs
  app-url: "https://app.cinacoin.com"
  api-url: "https://api.cinacoin.com"
  ws-url: "wss://ws.cinacoin.com"
  
  # Service URLs (internal)
  auth-service-url: "http://auth-service:3200"
  user-service-url: "http://user-service:3201"
  api-gateway-url: "http://api-gateway:8787"
  
  # Feature Flags
  enable-passkeys: "true"
  enable-totp: "true"
  enable-oauth: "true"
  enable-web3-auth: "true"
  enable-teams: "true"
  enable-bundler: "true"
  enable-paymaster: "true"
  
  # Third-party IDs (public)
  walletconnect-project-id: "CHANGE_ME"
  moonpay-api-key: "CHANGE_ME"
