apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  namespace: cinacoin
type: Opaque
stringData:
  database-url: "postgresql://cinacoin:CHANGE_ME@postgres:5432/cinacoin_users"
  service-api-key: "CHANGE_ME_GENERATE_SECURE_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: cinacoin
data:
  LOG_LEVEL: "info"
  AUTH_SERVICE_URL: "http://auth-service:3200"
  API_GATEWAY_URL: "http://api-gateway:8787"
