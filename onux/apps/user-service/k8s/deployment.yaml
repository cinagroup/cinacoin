apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cinacoin
  labels:
    app: user-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        version: v1
    spec:
      containers:
        - name: user-service
          image: cinacoin/user-service:latest
          ports:
            - containerPort: 3201
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3201"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: database-url
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: service-api-key
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3200"
            - name: API_GATEWAY_URL
              value: "http://api-gateway:8787"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3201
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3201
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3201
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      restartPolicy: Always
