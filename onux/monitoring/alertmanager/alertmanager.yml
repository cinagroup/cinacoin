# Alertmanager Configuration
global:
  resolve_timeout: 5m
  # Slack webhook URL (configure via environment variable)
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  # PagerDuty routing key (configure via environment variable)
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  group_by: ['alertname', 'severity', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      
    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 4h
      
    # Infrastructure alerts
    - match:
        category: infrastructure
      receiver: 'infra-alerts'
      
    # Security alerts - high priority
    - match:
        category: security
      receiver: 'security-alerts'
      group_wait: 10s
      repeat_interval: 30m
      
    # Business metrics alerts
    - match:
        category: business
      receiver: 'business-alerts'
      repeat_interval: 12h

# Receivers
receivers:
  # Default receiver
  - name: 'default-receiver'
    slack_configs:
      - channel: '#alerts-general'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Critical alerts - PagerDuty + Slack
  - name: 'critical-alerts'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .CommonAnnotations.description }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.critical.text" . }}'
        color: 'danger'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '${GRAFANA_URL}/alerting/list'
          - type: button
            text: 'Runbook'
            url: '{{ .CommonAnnotations.runbook_url }}'

  # Warning alerts - Slack only
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        title: '⚠️ WARNING: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.warning.text" . }}'
        color: 'warning'

  # Infrastructure alerts
  - name: 'infra-alerts'
    slack_configs:
      - channel: '#alerts-infra'
        send_resolved: true
        title: '🔧 INFRA: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.infra.text" . }}'
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Security alerts - immediate escalation
  - name: 'security-alerts'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_SECURITY_KEY}'
        severity: 'critical'
        description: '🔒 SECURITY: {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#alerts-security'
        send_resolved: true
        title: '🔒 SECURITY: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.security.text" . }}'
        color: 'danger'

  # Business metrics alerts
  - name: 'business-alerts'
    slack_configs:
      - channel: '#alerts-business'
        send_resolved: true
        title: '📊 BUSINESS: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.business.text" . }}'
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

# Inhibition rules
inhibit_rules:
  # Inhibit warning if critical is firing for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  
  # Inhibit all alerts if infrastructure is down
  - source_match:
      alertname: 'ContainerDown'
    target_match_re:
      category: '.*'
    equal: ['service']
