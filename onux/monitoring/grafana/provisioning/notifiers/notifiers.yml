# Grafana Notification Channels
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-critical
    receivers:
      - uid: slack-critical-1
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: '#alerts-critical'
          title: '🚨 CRITICAL: {{ .CommonLabels.alertname }}'
          text: '{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}'

  - orgId: 1
    name: slack-warning
    receivers:
      - uid: slack-warning-1
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: '#alerts-warning'
          title: '⚠️ WARNING: {{ .CommonLabels.alertname }}'
          text: '{{ .CommonAnnotations.summary }}'

  - orgId: 1
    name: pagerduty-critical
    receivers:
      - uid: pagerduty-1
        type: pagerduty
        settings:
          integrationKey: ${PAGERDUTY_ROUTING_KEY}
          severity: critical
          class: production
          component: cinacoin

policies:
  - orgId: 1
    receiver: slack-warning
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: pagerduty-critical
        matcher:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
