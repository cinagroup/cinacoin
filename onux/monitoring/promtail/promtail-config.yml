# Promtail Configuration - Log Shipping to Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker Container Logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Application Logs
  - job_name: application-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          __path__: /var/log/containers/*.log

  # System Logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog

  # Auth Service Logs
  - job_name: auth-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-service
          service: auth-service
          __path__: /var/log/containers/auth-service*.log

  # API Gateway Logs
  - job_name: api-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-gateway
          service: api-gateway
          __path__: /var/log/containers/api-gateway*.log

  # Cloudflare Logs (if using Cloudflare Logpush)
  - job_name: cloudflare
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloudflare
          service: cloudflare
          __path__: /var/log/cloudflare/*.log

# Pipeline stages for log processing
pipeline_stages:
  - docker: {}
  
  - timestamp:
      source: time
      format: RFC3339Nano
  
  - labels:
      container:
      service:
      level:
  
  - output:
      source: log
