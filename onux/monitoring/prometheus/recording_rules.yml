# Prometheus Recording Rules - Pre-computed metrics for faster queries
groups:
  - name: http_recording_rules
    interval: 30s
    rules:
      # HTTP Request Rate by Service
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_requests_total[5m]))

      # HTTP Error Rate by Service
      - record: job:http_errors:rate5m
        expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))

      # HTTP Error Percentage
      - record: job:http_error_percentage:rate5m
        expr: (job:http_errors:rate5m / job:http_requests:rate5m) * 100

      # HTTP Latency P50
      - record: job:http_latency:p50
        expr: histogram_quantile(0.50, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      # HTTP Latency P95
      - record: job:http_latency:p95
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      # HTTP Latency P99
      - record: job:http_latency:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

  - name: business_recording_rules
    interval: 1m
    rules:
      # User Registration Rate
      - record: job:user_registrations:rate1h
        expr: sum by (job) (rate(user_registrations_total[1h]))

      # Login Success Rate
      - record: job:login_success_rate:rate5m
        expr: (sum by (job) (rate(auth_login_successes_total[5m])) / sum by (job) (rate(auth_login_attempts_total[5m]))) * 100

      # API Calls by Endpoint
      - record: endpoint:api_calls:rate5m
        expr: sum by (endpoint) (rate(http_requests_total[5m]))

      # Active Users (last 5 minutes)
      - record: job:active_users:5m
        expr: count by (job) (count_over_time(user_activity_timestamp[5m]))

  - name: infrastructure_recording_rules
    interval: 30s
    rules:
      # CPU Usage by Instance
      - record: instance:cpu_usage:avg5m
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      # Memory Usage by Instance
      - record: instance:memory_usage:percentage
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100

      # Disk Usage by Instance
      - record: instance:disk_usage:percentage
        expr: ((node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes) * 100

      # Container Resource Usage
      - record: container:cpu:rate5m
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name=~".+"}[5m]))

      - record: container:memory:bytes
        expr: sum by (name) (container_memory_usage_bytes{name=~".+"})
