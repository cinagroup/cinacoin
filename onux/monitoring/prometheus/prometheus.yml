# Prometheus Configuration for Cinacoin Production
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'cinacoin-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'
  - '/etc/prometheus/recording_rules.yml'

# Scrape configurations
scrape_configs:
  # ===================
  # Prometheus Self-Monitoring
  # ===================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ===================
  # Node Exporter - Host Metrics
  # ===================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'

  # ===================
  # cAdvisor - Container Metrics
  # ===================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'containers'

  # ===================
  # Application Services
  # ===================
  
  # Auth Service (Node.js/Next.js)
  - job_name: 'auth-service'
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['auth-service:3001']
        labels:
          service: 'auth-service'
          component: 'backend'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'nodejs_.*'
        target_label: runtime
        replacement: 'nodejs'

  # User Service
  - job_name: 'user-service'
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['user-service:3002']
        labels:
          service: 'user-service'
          component: 'backend'

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'
          component: 'gateway'

  # Relay Server (Rust)
  - job_name: 'relay-server'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['relay:8080']
        labels:
          service: 'relay-server'
          component: 'blockchain'

  # RPC Proxy (Go)
  - job_name: 'rpc-proxy'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['rpc-proxy:8545']
        labels:
          service: 'rpc-proxy'
          component: 'blockchain'

  # Keys Server (Rust)
  - job_name: 'keys-server'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['keys-server:3001']
        labels:
          service: 'keys-server'
          component: 'security'

  # Demo App (Next.js)
  - job_name: 'demo-app'
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['demo:3000']
        labels:
          service: 'demo-app'
          component: 'frontend'

  # ===================
  # Database Metrics
  # ===================
  
  # PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          component: 'database'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # ===================
  # Cloudflare Workers (via push gateway or direct)
  # ===================
  - job_name: 'cloudflare-workers'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['analytics-dashboard:8787']
        labels:
          service: 'cloudflare-workers'
          component: 'edge'

  # ===================
  # Alertmanager Self-Monitoring
  # ===================
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
