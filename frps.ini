# FRP 服务端配置 - 放在 VPS 上
# 文件位置：/etc/frp/frps.ini 或 ~/.frp/frps.ini

[common]
# 绑定端口（客户端连接用）
bind_port = 7000

# 可选：Dashboard 管理界面
dashboard_port = 7500
dashboard_user = admin
dashboard_pwd = admin123

# 认证 token（客户端需要匹配）
token = cinaclaw_qqbot_secret_2026

# 日志
log_file = /var/log/frps.log
log_level = info
log_max_days = 7

# 性能优化
tcp_mux = true
max_pool_count = 10
