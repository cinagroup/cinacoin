workers_dev = true

name = "cinacoin-relay-server"
main = "cloudflare/worker.ts"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "relay.cinacoin.com", custom_domain = true }
]

[vars]
# Environment-specific configuration
RELAY_URL = "wss://relay.walletconnect.com"

[durable_objects]
bindings = [
  { name = "RelaySession", class_name = "RelaySession" }
]

[[kv_namespaces]]
binding = "RELAY_CACHE"
id = "1a8dc90cb91c423695be43ce74028c88"

[dev]
ip = "localhost"
port = 8787
local_protocol = "http"
upstream_protocol = "https"