name = "cinacoin-analytics"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Production environment
[env.production]
name = "cinacoin-analytics-prod"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "CinacoinAnalytics"
database_id = "cb436ca8-0579-487d-9f1c-260e3b69c971"
migrations_dir = "migrations"

# KV for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "dceb86e5cb4c4a008013c8cf21d7181c"
preview_id = "dceb86e5cb4c4a008013c8cf21d7181c"

# KV for deduplication
[[kv_namespaces]]
binding = "DEDUP_KV"
id = "68c1ccdd1e3d422ba534ad2333bfd775"
preview_id = "68c1ccdd1e3d422ba534ad2333bfd775"

[vars]
API_KEY = ""
RATE_LIMIT = "1000"
RATE_WINDOW = "3600"
BATCH_SIZE = "100"
GDPR_ANONYMIZE = "true"
