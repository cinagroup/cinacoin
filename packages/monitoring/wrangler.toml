name = "cinacoin-monitoring"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# Multi-region smart placement (INF-12)
placement = { mode = "smart" }

routes = [
  { pattern = "monitor.cinacoin.com", custom_domain = true }
]

[vars]
POLL_INTERVAL_SECONDS = "30"
ALERT_COOLDOWN_SECONDS = "300"
DISCORD_WEBHOOK_URL = ""

[[kv_namespaces]]
binding = "MONITORING_KV"
id = "edf4a47f3178473ca1e069aa140a2e6f"

[[d1_databases]]
binding = "MONITORING_DB"
database_name = "cinacoin-monitoring"
database_id = "ff3076b9-c077-4e24-ba66-0d3394d8adc2"

[triggers]
crons = ["*/5 * * * *"]
