workers_dev = true

name = "cinacoin-notify-server"
main = "cloudflare/worker.ts"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "notify.cinacoin.com", custom_domain = true }
]

[vars]
# Environment-specific configuration
NOTIFY_SERVICE_URL = "https://notify.cinacoin.com"

[dev]
ip = "localhost"
port = 8791
local_protocol = "http"
upstream_protocol = "https"