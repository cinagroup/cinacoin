# Cloudflare Worker configuration for Keys Server
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "keys-server"
main = "worker.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Multi-region smart placement (INF-12)
placement = { mode = "smart" }

# KV Namespace bindings
# Create these KV namespaces in Cloudflare dashboard or via wrangler:
#   wrangler kv:namespace create KEYS_KV
#   wrangler kv:namespace create RATELIMIT_KV
# Then replace the IDs below with your actual namespace IDs

[[kv_namespaces]]
binding = "KEYS_KV"
id = "YOUR_KEYS_KV_NAMESPACE_ID"
preview_id = "YOUR_KEYS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "RATELIMIT_KV"
id = "YOUR_RATELIMIT_KV_NAMESPACE_ID"
preview_id = "YOUR_RATELIMIT_KV_PREVIEW_ID"

# Environment variables (set via wrangler secret for production)
# wrangler secret put ENCRYPTION_KEY
# wrangler secret put JWT_SECRET

[vars]
# CORS_ORIGINS = "https://example.com,https://app.example.com"
# RATE_LIMIT_MAX = "100"
# RATE_LIMIT_WINDOW = "60"

# Production environment overrides
[env.production]
name = "keys-server-prod"
# routes = [
#   { pattern = "keys.example.com/*", zone_name = "example.com" }
# ]

# Staging environment
[env.staging]
name = "keys-server-staging"

# Development environment
[env.dev]
name = "keys-server-dev"
