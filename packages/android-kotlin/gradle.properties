# ─── Cinacoin Android SDK Gradle Properties ─────────────────────────────────

# Android build settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Publishing / Maven Central (Sonatype OSSRH)
# Override with local.properties or environment variables for security.
# Required for `publishReleasePublicationToSonatypeRepository`:
#   OSSRH_USERNAME  /  ossrhUsername  – Sonatype JIRA username
#   OSSRH_PASSWORD  /  ossrhPassword  – Sonatype JIRA password (or API token)

# ─── Signing (PGP) ──────────────────────────────────────────────────────────
# Required for Maven Central staging release.
#   SIGNING_KEY_ID       – GPG key ID (last 8 chars)
#   SIGNING_KEY          – ASCII-armored private key (or gpg --export-secret-keys)
#   SIGNING_PASSWORD     – GPG passphrase
# Can also use gradle.properties keys: signing.keyId, signingKey, signing.password

# ─── Library Coordinates ────────────────────────────────────────────────────
GROUP=com.cinacoin
POM_ARTIFACT_ID=sdk-android
VERSION_NAME=1.0.0

# ─── POM Metadata ───────────────────────────────────────────────────────────
POM_NAME=Cinacoin Wallet SDK
POM_DESCRIPTION=Android SDK for Cinacoin Wallet — WalletConnect v2, EVM chain support, signing, and transactions.
POM_URL=https://github.com/cinacoin/sdk-android
POM_SCM_URL=https://github.com/cinacoin/sdk-android
POM_SCM_CONNECTION=scm:git:git://github.com/cinacoin/sdk-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/cinacoin/sdk-android.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=cinacoin
POM_DEVELOPER_NAME=Cinacoin Team
POM_DEVELOPER_EMAIL=dev@cinacoin.com

# ─── Gradle Performance ────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
